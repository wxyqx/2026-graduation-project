# 自动化测试：每次 push / PR 到 main 时
#   1. ruff 静态检查（后端）
#   2. 前端 build（语法 / 打包错误）
#   3. 用独立测试库跑全部 8 套断言
# 本地等效命令：
#   cd ats/backend && python -m ruff check .
#   cd ats/frontend && npm run build
#   cd ats/backend && python scripts/run_all_tests.py
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ATS_DB_PASSWORD: root
      ATS_DB_NAME: ats_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ats/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ats/frontend/package-lock.json

      - name: 安装后端依赖 + ruff
        working-directory: ats/backend
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: ruff 静态检查
        working-directory: ats/backend
        run: ruff check .

      - name: 安装前端依赖并 build
        working-directory: ats/frontend
        run: |
          npm ci
          npm run build

      - name: 跑全量测试
        working-directory: ats/backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ats_test?charset=utf8mb4
        run: python scripts/run_all_tests.py
