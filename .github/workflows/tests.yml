# 自动化测试：每次 push / PR 到 main 时，用独立测试库跑全部 7 套断言
# 本地等效命令：cd ats/backend && python scripts/run_all_tests.py
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ATS_DB_PASSWORD: root
      ATS_DB_NAME: ats_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ats/backend/requirements.txt

      - name: 安装依赖
        working-directory: ats/backend
        run: pip install -r requirements.txt

      # run_all_tests.py 会自建 ats_test 库、起独立测试服务（8001）、依次跑 7 套脚本
      - name: 跑全量测试
        working-directory: ats/backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ats_test?charset=utf8mb4
        run: python scripts/run_all_tests.py
